name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Dependency integrity
        run: python -m pip check
      - name: Static checks
        run: python -m ruff check src tests scripts
      - name: Evidence contract
        run: python -m aads_public replay
      - name: Notebook contract
        run: python scripts/validate_public_notebooks.py
      - name: Tests
        run: python -m pytest
      - name: Wheel build
        run: python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir dist .
