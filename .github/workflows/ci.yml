name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      # CPU wheels first: the default CUDA build pulls several GB of nvidia-* packages the tests never use.
      - run: python -m pip install "torch~=2.15.0" "torchvision~=0.29.2" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev]"

      - name: Check
        run: |
          ruff check src scripts tests
          pytest -q --runintegration
