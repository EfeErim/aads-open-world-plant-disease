[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aads-public"
version = "1.1.1"
description = "Compact public edition of an open-world plant disease recognition thesis project"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Efe Erim"}]
keywords = ["computer-vision", "continual-learning", "lora", "open-set-recognition", "ood"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26,<3"]

[project.urls]
Repository = "https://github.com/EfeErim/bitirmeprojesi"
Documentation = "https://github.com/EfeErim/bitirmeprojesi#readme"
Release = "https://github.com/EfeErim/bitirmeprojesi/releases/tag/aads-public-demo-v1.1.1"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[project.scripts]
aads = "aads_public.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aads_public = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
