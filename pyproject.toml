[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aads-open-world-plant-disease"
version = "0.1.0"
description = "Open-world plant disease routing, per-target LoRA adapter training and adapter inference"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
authors = [{name = "Efe Erim"}]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]
# The router's BioCLIP stage; Colab installs it from requirements_colab.txt.
inference = ["open-clip-torch~=3.3.0"]

[project.urls]
Repository = "https://github.com/EfeErim/aads-open-world-plant-disease"

[project.scripts]
aads = "src.app.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".runtime_tmp/.pytest_cache"
addopts = ["--tb=short", "--strict-markers"]
markers = ["integration: integration tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
exclude = [".runtime_tmp", ".venv", "colab_notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "BLE", "S110", "S112", "TID251", "RUF100"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"scripts".msg = "Application code must not depend on scripts."
"tests".msg = "Application code must not depend on tests."

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["TID251"]
"tests/**" = ["TID251"]
# Notebook-facing code reports failures to the notebook user and keeps the runtime alive, so broad
# excepts are allowed here. Everything else must catch specific exception types.
"scripts/notebook_cells/*.py" = ["E402", "F401", "F821", "I001", "BLE001"]
"scripts/notebook_helpers/*.py" = ["BLE001"]
"src/colab/*.py" = ["BLE001"]
"scripts/evaluate_router_surface.py" = ["E402"]
