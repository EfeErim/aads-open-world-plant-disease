[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aads-v6"
version = "0.1.0"
description = "Open-world plant disease routing, continual SD-LoRA training and adapter inference"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
authors = [{name = "Efe Erim"}]
keywords = ["computer-vision", "continual-learning", "lora", "open-set-recognition", "ood"]

[project.urls]
Repository = "https://github.com/EfeErim/aads-open-world-plant-disease"
Release = "https://github.com/EfeErim/aads-open-world-plant-disease/releases/tag/aads-public-demo-v1.1.2"

[project.scripts]
aads = "src.app.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
cache_dir = ".runtime_tmp/.pytest_cache"
norecursedirs = ["__pycache__", ".runtime_tmp", ".venv"]
addopts = ["--tb=short", "--strict-markers"]
markers = ["integration: integration tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".runtime_tmp", ".venv", "colab_notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I"]
extend-select = ["BLE", "S110", "S112"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Colab/notebook layer: cells report failures to the notebook user and keep the runtime alive, so broad
# excepts are allowed here during the transition. Everything else must catch specific exception types.
"scripts/notebook_cells/*.py" = ["E402", "F401", "F821", "I001", "BLE001"]
"scripts/notebook_helpers/*.py" = ["BLE001"]
"src/colab/*.py" = ["BLE001"]
"scripts/evaluate_router_surface.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["^colab_notebooks/", "^\\.runtime_tmp/", "^tests/"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 78
show_missing = true
skip_covered = true
