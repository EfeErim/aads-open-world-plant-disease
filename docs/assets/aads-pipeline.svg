<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">AADS open-world plant disease inference flow</title>
  <desc id="desc">A plant image moves through crop and part routing to a crop-part adapter, which either predicts a supported disease or sends the image to review.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111d32"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b9bb4"/>
    </marker>
  </defs>

  <rect width="1200" height="430" rx="28" fill="url(#background)"/>
  <text x="54" y="56" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">
    Open-world inference: answer when supported, review when uncertain
  </text>
  <text x="54" y="86" fill="#8b9bb4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">
    The router and disease adapters are evaluated separately.
  </text>

  <g filter="url(#shadow)">
    <rect x="54" y="119" width="285" height="205" rx="18" fill="#17243a" stroke="#2d405f"/>
    <rect x="457" y="119" width="285" height="205" rx="18" fill="#17243a" stroke="#2d405f"/>
    <rect x="861" y="119" width="285" height="205" rx="18" fill="#17243a" stroke="#2d405f"/>
  </g>

  <text x="78" y="151" fill="#58a6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">01 · INPUT</text>
  <rect x="78" y="168" width="92" height="126" rx="12" fill="#0b1525" stroke="#334b6e"/>
  <path d="M124 271 C86 242 88 194 139 181 C165 215 156 254 124 271 Z" fill="url(#leaf)"/>
  <path d="M119 268 C128 236 136 210 145 188" fill="none" stroke="#d2ffd5" stroke-width="3" stroke-linecap="round"/>
  <path d="M126 246 L104 226 M132 228 L151 212" fill="none" stroke="#d2ffd5" stroke-width="2" stroke-linecap="round"/>
  <text x="190" y="202" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650">Plant image</text>
  <text x="190" y="231" fill="#8b9bb4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">whole-image input</text>
  <text x="190" y="257" fill="#8b9bb4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">crop unknown</text>
  <text x="190" y="283" fill="#8b9bb4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">part unknown</text>

  <line x1="359" y1="221" x2="431" y2="221" stroke="#8b9bb4" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="481" y="151" fill="#d2a8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">02 · ROUTER</text>
  <circle cx="513" cy="202" r="18" fill="#6e40c9"/>
  <circle cx="513" cy="258" r="18" fill="#1f6feb"/>
  <path d="M532 202 H563 M532 258 H563 M513 220 V240" fill="none" stroke="#8b9bb4" stroke-width="3"/>
  <rect x="563" y="178" width="150" height="48" rx="10" fill="#0b1525" stroke="#3b4f70"/>
  <rect x="563" y="234" width="150" height="48" rx="10" fill="#0b1525" stroke="#3b4f70"/>
  <text x="580" y="198" fill="#8b9bb4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">CROP</text>
  <text x="580" y="216" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650">tomato</text>
  <text x="580" y="254" fill="#8b9bb4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">PART</text>
  <text x="580" y="272" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650">leaf</text>
  <text x="481" y="306" fill="#8b9bb4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">unsafe handoff → review</text>

  <line x1="762" y1="221" x2="835" y2="221" stroke="#8b9bb4" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="885" y="151" fill="#ffa657" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">03 · TARGET ADAPTER</text>
  <text x="885" y="188" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650">tomato · leaf · SD-LoRA</text>
  <rect x="885" y="208" width="237" height="42" rx="10" fill="#123322" stroke="#2ea043"/>
  <circle cx="906" cy="229" r="6" fill="#3fb950"/>
  <text x="922" y="234" fill="#b6f3bd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650">supported → disease class</text>
  <rect x="885" y="260" width="237" height="42" rx="10" fill="#3a2c12" stroke="#d29922"/>
  <circle cx="906" cy="281" r="6" fill="#d29922"/>
  <text x="922" y="286" fill="#ffe2a8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650">unknown → REVIEW</text>

  <rect x="54" y="351" width="312" height="45" rx="22.5" fill="#123322" stroke="#2ea043"/>
  <text x="78" y="379" fill="#b6f3bd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">SUPPORTED CASES · 36/36</text>
  <rect x="386" y="351" width="286" height="45" rx="22.5" fill="#3a2c12" stroke="#d29922"/>
  <text x="410" y="379" fill="#ffe2a8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">REVIEW CASES · 12/12</text>
  <rect x="692" y="351" width="454" height="45" rx="22.5" fill="#102b46" stroke="#1f6feb"/>
  <text x="716" y="379" fill="#b9ddff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">FALSE ACCEPTS ON REVIEW · 0</text>
</svg>
